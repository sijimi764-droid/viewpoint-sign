name: ci

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore tests/ViewpointSign.Tests/ViewpointSign.Tests.csproj
      - name: Build
        run: dotnet build tests/ViewpointSign.Tests/ViewpointSign.Tests.csproj --configuration Release --no-restore
      - name: Test
        run: dotnet test tests/ViewpointSign.Tests/ViewpointSign.Tests.csproj --configuration Release --no-build --verbosity normal
      - name: Generate G3 physical package
        run: dotnet run --project src/ViewpointSign.Poc/ViewpointSign.Poc.csproj --configuration Release -- artifacts/g3-physical
      - name: Upload G3 physical package
        uses: actions/upload-artifact@v4
        with:
          name: g3-physical-package
          path: artifacts/g3-physical
          if-no-files-found: error
